[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hmcp-radarr"
version = "0.1.0"
description = "Radarr API v3 connector for Home MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["hmcp>=0.1,<0.2", "httpx>=0.28,<1"]

[project.entry-points."hmcp.connectors"]
radarr = "hmcp_radarr:RadarrConnector"

[tool.hatch.build.targets.wheel]
packages = ["src/hmcp_radarr"]
