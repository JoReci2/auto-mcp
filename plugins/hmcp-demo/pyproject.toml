[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hmcp-demo"
version = "0.1.0"
description = "Example connector and skill for Home MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["hmcp>=0.1,<0.2"]

[project.entry-points."hmcp.connectors"]
demo = "hmcp_demo:DemoConnector"

[tool.hatch.build.targets.wheel]
packages = ["src/hmcp_demo"]
