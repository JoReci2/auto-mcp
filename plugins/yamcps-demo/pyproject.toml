[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yamcps-demo"
version = "0.1.0"
description = "Example connector and skill for Yet Another Model Context Protocole Server"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["yamcps>=0.1,<0.2"]

[project.entry-points."yamcps.connectors"]
demo = "yamcps_demo:DemoConnector"

[tool.hatch.build.targets.wheel]
packages = ["src/yamcps_demo"]
