[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hmcp-sonarr"
version = "0.1.0"
description = "Sonarr API v3 connector for Home MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["hmcp>=0.1,<0.2", "httpx>=0.28,<1"]

[project.entry-points."hmcp.connectors"]
sonarr = "hmcp_sonarr:SonarrConnector"

[tool.hatch.build.targets.wheel]
packages = ["src/hmcp_sonarr"]
