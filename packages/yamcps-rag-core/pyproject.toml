[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yamcps-rag-core"
version = "0.1.0"
description = "Local retrieval primitives shared by yamcps plugins"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]

[tool.hatch.build.targets.wheel]
packages = ["src/yamcps_rag_core"]
