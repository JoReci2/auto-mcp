[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yamcps"
version = "0.1.0"
description = "Yet Another Model Context Protocole Server: a plugin-based MCP server with skills"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=2.3,<3", "PyYAML>=6,<7", "cryptography>=46,<51", "pydantic>=2,<3"]

[project.scripts]
yamcps = "yamcps.cli:main"

[project.optional-dependencies]
rag = ["sentence-transformers>=3,<6", "huggingface-hub>=0.34,<2"]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff", "mypy", "types-PyYAML", "build", "hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/yamcps"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/plugins", "/README.md", "/contributing.md", "/AGENTS.md", "/docs", "/LICENSE", "/pyproject.toml", "/scripts", "/.github/workflows/workflow.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
