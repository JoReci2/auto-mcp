name: Publish yamcps to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build base distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify release is based on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build only the base package
        run: python -m build --outdir dist/base .
      - name: Validate distribution identity and release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/verify_release.py dist/base --tag "$RELEASE_TAG"
      - name: Check PyPI metadata
        run: python -m twine check --strict dist/base/*
      - uses: actions/upload-artifact@v4
        with:
          name: yamcps-distributions
          path: dist/base/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish base distribution
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/yamcps
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yamcps-distributions
          path: dist/base
      - name: Publish yamcps only
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/base/
